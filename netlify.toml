# Netlify config for the IMPACT demo.
# The site is plain static HTML in site/ — there is nothing to build.
# tools/ and the design reference files live outside the publish dir and are
# therefore never deployed.

# The static site in site/ is the whole site. The Astro app that used to live in
# web/ has been removed — this is a front-end-only repository now.
[build]
  publish = "site"
  command = ""

# Serverless endpoints. Netlify picks these up with no build step, which is why
# they live on the static site rather than waiting for the Astro app:
#   /.netlify/functions/subscribe   newsletter + waitlist  -> Brevo
#   /.netlify/functions/tt-webhook  Ticket Tailor          -> Brevo + log
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"


# style.css and the JS bundles carry a ?v=<content hash> (tools/fingerprint.py),
# so their URL changes whenever their bytes do and they can be cached forever.
# Before this they shared the blanket /assets/* rule below, which meant a
# returning visitor kept the old CSS and JS for a week after a fix went out.
[[headers]]
  for = "/assets/css/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/js/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Photography, video, logos and the brochure are not fingerprinted, so a day —
# long enough to be free on a session, short enough that replacing a file
# (a video poster, say) reaches people without waiting out a week.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

# robots.txt allows crawling because the production domain should be crawled;
# the edge function in netlify/edge-functions/noindex.ts adds
# `X-Robots-Tag: noindex` on every other host, so staging and previews stay out
# of the index without a launch-day checklist step.

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
