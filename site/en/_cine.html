<!doctype html><meta charset="utf-8"><style>body{margin:0}iframe{border:0;display:block}</style>
<script>
var q=new URLSearchParams(location.search), e=q.get('e')||'0', w=q.get('w')||'1400';
document.write('<iframe id="f" src="media.html" style="width:'+w+'px;height:1000px"></iframe>');
document.getElementById('f').addEventListener('load',function(){
  var d=this.contentDocument, c=d.querySelector('[data-cine]');
  c.style.setProperty('--expand', e);
  c.scrollIntoView();
  // hold the frame in view for the capture
  var r=c.getBoundingClientRect();
  this.contentWindow.scrollTo(0, this.contentWindow.scrollY + r.top - 40);
});
</script>
